[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# RAGAS judge tests call an external LLM, so they are opt-in: pytest -m ragas (with AFC_RAGAS_ENABLED=1).
addopts = "-m 'not ragas'"
markers = [
    "ragas: calls an external LLM judge; requires AFC_RAGAS_ENABLED=1 and OPENAI_API_KEY",
]
